name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledgercore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d ledgercore_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-ci-only-secret-key-0123456789
      TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledgercore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Dependency security audit
        run: pip-audit -r requirements-dev.txt
      - name: Tests (PostgreSQL, coverage gate 85%)
        run: pytest
      - name: Migration parity (run as a non-superuser migration role)
        env:
          DATABASE_URL: postgresql+psycopg://ledger_migrator:migrator-ci@localhost:5432/ledgercore_migrations
        run: |
          PGPASSWORD=ledger psql -h localhost -U ledger -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ledger_migrator LOGIN PASSWORD 'migrator-ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE DATABASE ledgercore_migrations OWNER ledger;
          SQL
          PGPASSWORD=ledger psql -h localhost -U ledger -d ledgercore_migrations -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SCHEMA public OWNER TO ledger_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO ledger_migrator;
          SQL
          # Seed immutable records at revision 0003 so the tenant migration proves that it
          # can backfill existing audit and ledger rows, not only empty tables.
          alembic upgrade 0003
          PGPASSWORD=ledger psql -h localhost -U ledger -d ledgercore_migrations -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO accounts (code, name, account_type, is_active, created_at)
          VALUES
            ('1000', 'Migration Fixture Cash', 'ASSET', true, CURRENT_TIMESTAMP),
            ('3000', 'Migration Fixture Capital', 'EQUITY', true, CURRENT_TIMESTAMP);
          UPDATE document_sequences SET last_value = 1 WHERE name = 'AUDIT';
          INSERT INTO audit_logs (seq, actor, action, entity, details, created_at, prev_hash, row_hash)
          VALUES (1, 'migration-ci', 'FIXTURE', 'legacy-row', 'must survive tenant backfill',
                  CURRENT_TIMESTAMP, 'genesis', 'migration-ci-hash');
          BEGIN;
          INSERT INTO journal_entries
            (reference_no, entry_date, accounting_period, description, source, posted_by, created_at)
          VALUES ('MIGRATION-CI', CURRENT_DATE, to_char(CURRENT_DATE, 'YYYY-MM'),
                  'Migration backfill fixture', 'MANUAL', 'migration-ci', CURRENT_TIMESTAMP)
          RETURNING id AS entry_id \gset
          SELECT id AS cash_id FROM accounts WHERE code = '1000' \gset
          SELECT id AS capital_id FROM accounts WHERE code = '3000' \gset
          INSERT INTO ledger_lines (entry_id, account_id, debit, credit)
          VALUES (:'entry_id', :'cash_id', 125.00, 0.00),
                 (:'entry_id', :'capital_id', 0.00, 125.00);
          INSERT INTO journal_entry_seals (entry_id, sealed_at)
          VALUES (:'entry_id', CURRENT_TIMESTAMP);
          COMMIT;
          SQL
          alembic upgrade head
          test "$(PGPASSWORD=ledger psql -h localhost -U ledger -d ledgercore_migrations -Atc "SELECT count(*) FROM audit_logs WHERE organization_id = 1")" = "1"
          test "$(PGPASSWORD=ledger psql -h localhost -U ledger -d ledgercore_migrations -Atc "SELECT count(*) FROM journal_entries WHERE organization_id = 1")" = "1"
          test "$(PGPASSWORD=ledger psql -h localhost -U ledger -d ledgercore_migrations -Atc "SELECT count(*) FROM ledger_lines WHERE organization_id = 1")" = "2"
          test "$(PGPASSWORD=ledger psql -h localhost -U ledger -d ledgercore_migrations -Atc "SELECT count(*) FROM journal_entry_seals WHERE organization_id = 1")" = "1"
          alembic check

  frontend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-ci-only-secret-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser tests (Playwright)
        run: pytest -q e2e -o addopts=''
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgercore-browser-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore

  docker:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the compose stack
        run: |
          set -Eeuo pipefail
          printf "SECRET_KEY=%s\nPOSTGRES_PASSWORD=%s\nLEDGER_MIGRATOR_PASSWORD=%s\nLEDGER_APP_PASSWORD=%s\nSEED_DEMO_DATA=true\nENVIRONMENT=production\nCOOKIE_SECURE=true\n" \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 12)" \
            "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
          if ! docker compose up -d --build; then
            docker compose logs --no-color db role-bootstrap migrator api || true
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker compose logs --no-color db role-bootstrap migrator api || true
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8000/ | grep -q LedgerCore
          docker compose logs api | tail -n 20
          docker compose down -v
