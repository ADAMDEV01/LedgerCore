services:
  db:
    image: postgres:16-alpine
    environment:
      # Bootstrap administrator only. It is not used by either application service.
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ledgercore
      LEDGER_MIGRATOR_PASSWORD: ${LEDGER_MIGRATOR_PASSWORD:?set LEDGER_MIGRATOR_PASSWORD in .env}
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:?set LEDGER_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init/010-create-db-roles.sh:/docker-entrypoint-initdb.d/010-create-db-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgercore"]
      interval: 5s
      timeout: 5s
      retries: 10

  role-bootstrap:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ledgercore
      PGUSER: ledger
      POSTGRES_USER: ledger
      POSTGRES_DB: ledgercore
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      LEDGER_MIGRATOR_PASSWORD: ${LEDGER_MIGRATOR_PASSWORD:?set LEDGER_MIGRATOR_PASSWORD in .env}
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:?set LEDGER_APP_PASSWORD in .env}
    volumes:
      - ./docker/init/010-create-db-roles.sh:/scripts/bootstrap-roles.sh:ro
    entrypoint: ["/bin/sh", "/scripts/bootstrap-roles.sh"]
    restart: "no"

  migrator:
    build: .
    depends_on:
      role-bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://ledger_migrator:${LEDGER_MIGRATOR_PASSWORD}@db:5432/ledgercore
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://ledger_app:${LEDGER_APP_PASSWORD}@db:5432/ledgercore
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@ledgercore.io}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DEMO_VIEWER_EMAIL: ${DEMO_VIEWER_EMAIL:-}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
