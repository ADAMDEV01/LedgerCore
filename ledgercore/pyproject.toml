[project]
name = "ledgercore"
version = "4.0.0"
description = "Double-entry accounting API with an append-only, hash-chained audit trail"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP045"]  # keep Optional[...] readable for SQLAlchemy/pydantic annotations

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"tests/*" = ["E501", "B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = false
exclude = ["tests/", "alembic/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=85"
filterwarnings = [
  "ignore::sqlalchemy.exc.SAWarning",
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = ["app/seed.py"]
